version: "3.8"

services:

  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:latest
    container_name: oil-gas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - wellsense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Django REST API Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./UI/backend
      dockerfile: dockerfile
    container_name: wellsense-backend
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      # ML model artifacts (read-only — produced by AI pipeline)
      - ./AI/models:/ai_pipeline/models:ro
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Next.js Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./UI/frontend
      dockerfile: dockerfile
    container_name: wellsense-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── AI Pipeline (one-shot training job) ─────────────────────────────────
  ai-pipeline:
    build:
      context: ./AI
      dockerfile: dockerfile
    container_name: wellsense-ai-pipeline
    restart: "no"
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      - ./AI/config:/app/config:ro
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed
      - ./AI/models:/app/models
      - ./plots:/app/plots
      - ./reports:/app/reports
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  wellsense_pgdata:
