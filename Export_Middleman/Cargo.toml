[package]
name = "oil_gas_export"
version = "0.1.0"
edition = "2021"

# Tells Cargo to compile export_script.rs into an executable named "export_job"
[[bin]]
name = "export_job"
path = "export_script.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "macros", "rust_decimal"] }
rust_decimal = "1.32"
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.17"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
anyhow = "1.0"